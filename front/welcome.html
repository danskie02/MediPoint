<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediPoint</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background-image: url('../images/Welcomepage1.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    overflow:hidden;
    position:relative;
}

/* Dark overlay for readability */
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        to right,
        rgba(20,20,20,0.45),
        rgba(20,20,20,0.20),
        rgba(20,20,20,0.05)
    );
    z-index:0;
}

.container{
    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    padding-left:8%;
    padding-right:8%;

    position:relative;
    z-index:1;
}

.content{
    max-width:700px;
    color:white;
    text-align:left;
}

/* Welcome Badge */

.welcome-badge{
    display:inline-flex;
    align-items:center;
    gap:12px;

    padding:12px 24px;
    margin-bottom:35px;

    border-radius:50px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.15);

    color:#fff;
    font-size:1rem;
    font-weight:500;

    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}


/* Main Title */

h1{
    font-size:10rem;
    font-weight:800;
    line-height:1;
    margin-bottom:25px;

    text-shadow:
        0 4px 10px rgba(0,0,0,0.35);
}

.highlight{
    color:#E63946;
}

/* Description */

.description{
    font-size:1.8rem;
    font-weight:400;
    line-height:1.5;
    color:#f4f4f4;

    margin-bottom:50px;
}

.description strong{
    font-weight:700;
}

/* Button */

.btn{
    border:none;
    cursor:pointer;

    background:#C62839;

    color:white;
    font-size:1.4rem;
    font-weight:600;

    padding:18px 36px;

    border-radius:14px;

    display:inline-flex;
    align-items:center;
    gap:15px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.25);

    transition:all .3s ease;
}

.btn:hover{
    background:#A91E2D;

    transform:translateY(-3px);

    box-shadow:
        0 14px 30px rgba(0,0,0,0.35);
}

.welcome-actions { display:flex; flex-wrap:wrap; gap:14px; }
.btn.portal-btn { background:white; color:#C62839; border:2px solid #C62839; }
.btn.portal-btn:hover { background:#fff4f4; }

/* Responsive */

@media(max-width:992px){

    .container{
        justify-content:center;
        padding:40px;
    }

    .content{
        text-align:center;
    }

    .welcome-badge{
        justify-content:center;
    }

    h1{
        font-size:5rem;
    }

    .description{
        font-size:1.2rem;
    }
}

@media(max-width:768px){

    h1{
        font-size:3.5rem;
    }

    .description{
        font-size:1rem;
    }

    .btn{
        font-size:1.1rem;
        padding:15px 28px;
    }

}

@media(max-width:480px){

    h1{
        font-size:2.8rem;
    }

    .description{
        font-size:0.95rem;
    }

    .btn{
        width:100%;
        justify-content:center;
    }

    .welcome-badge{
        width:100%;
        justify-content:center;
    }
}

  :is(button, a):focus-visible {
    outline: 3px solid #1d4ed8;
    outline-offset: 3px;
  }
</style>
</head>

<body>

<div class="container">
    <div class="content">
        <div class="welcome-badge">
            <span>
                Welcome to <strong>MediPoint</strong>
            </span>

        </div>

        <h1>
            Medi<span class="highlight">Point</span>
        </h1>

        <p class="description">
            <strong>Scan Fast. Know Now. Stay Healthy.</strong><br>
            Empowering smarter healthcare through quick,
            reliable, and accessible health assessments.
        </p>

        <div class="welcome-actions">
            <button class="btn" onclick="startApp()">Use the Kiosk</button>
            <button class="btn portal-btn" onclick="openPortal()">Open Portal</button>
        </div>

    </div>

</div>

<script>
function startApp(){
    window.location.href = "login-pages/login-landing.html";
}
function openPortal(){
    window.location.href = "login-pages/portal-auth.html";
}
</script>
 
</body>
</html>

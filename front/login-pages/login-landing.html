<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediPoint Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body{
    min-height:100vh;
    background-image:url('../../images/Welcomepage1.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    overflow:hidden;
    position:relative;
    display: flex;
    justify-content: center;
    align-items: center;
    }

    .logo {
      position: absolute;
      top: 25px;
      left: 35px;
      width: 165px;
      z-index: 5;
    }

    .portal-access {
      position: absolute;
      top: 28px;
      right: 35px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 22px;
      border: 2px solid #c92228;
      border-radius: 12px;
      background: #fff;
      color: #c92228;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 15px rgba(0,0,0,.12);
      transition: .2s;
    }

    .portal-access:hover {
      background: #c92228;
      color: #fff;
      transform: translateY(-2px);
    }

    .card {
    width: 80%;
    max-width: 1030px;
    min-height: 595px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
    padding: 60px;
    position: relative;
    z-index: 2;
    text-align: center;
    }

   .avatar {
    width: 108px;
    height: 108px;
    background: #fff1f1;
    border: 8px solid #fff;
    border-radius: 50%;
    position: absolute;
    top: -55px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    overflow: hidden;
    }

    .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;

    }
    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-top: 5px;
    }

    h1 span {
      color: #c92228;
    }

    .subtitle {
      color: #666;
      font-size: 17px;
      margin-bottom: 22px;
    }

    .role-container,
    .login-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      margin-bottom: 14px;
    }

    .role-card {
      height: 140px;
      border: none;
      border-radius: 28px;
      background: #fff;
      box-shadow: 15px 15px 20px rgba(0,0,0,0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: 0.25s;
    }

    .role-card:hover,
    .login-option:hover {
      transform: translateY(-4px);
    }

    .role-card.active,
    .login-option.active {
      outline: 4px solid #c92228;
    }

    .icon-circle img{
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .role-card h2 {
      font-size: 35px;
      font-weight: 800;
      color: #000;
    }
        
    .login-option {
        height: 68px;
        border: none;
        border-radius: 30px;
        background: #f0f0f0;
        box-shadow: 12px 12px 20px rgba(0,0,0,0.22);

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;

        cursor: pointer;
        transition: 0.25s;

        font-size: 26px;
        font-weight: 500;
    }

    .login-option:hover {
        transform: translateY(-4px);
    }

    .login-option.active {
        outline: 4px solid #c92228;
    }

    .login-option img {
        width: 32px;
        height: 32px;
        object-fit: contain;
    }

    .login-option span {
        font-size: 28px;
        font-weight: 500;
        color: #333;
    }
    .continue-btn {
      width: 100%;
      height: 62px;
      border: none;
      border-radius: 10px;
      background: #ed1c24;
      color: white;
      font-size: 19px;
      font-weight: 700;
      margin-top: 6px;
      cursor: pointer;
      box-shadow: 12px 12px 18px rgba(0,0,0,0.25);
      transition: 0.25s;
    }

    .continue-btn:hover {
      background: #c9141b;
      transform: translateY(-2px);
    }

    .signup-text {
      margin-top: 35px;
      color: #777;
      font-size: 17px;
      font-weight: 600;
    }

    .signup-link {
      margin-top: 6px;
      display: inline-block;
      color: #5a78ff;
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
    }

    .signup-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 850px) {
      .card {
        width: 90%;
        padding: 55px 25px 35px;
      }

      .role-container,
      .login-container {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      h1 {
        font-size: 32px;
      }

      .role-card h2 {
        font-size: 28px;
      }

      .logo {
        width: 130px;
      }

      .portal-access {
        top: 24px;
        right: 20px;
        min-height: 40px;
        padding: 0 14px;
        font-size: 13px;
      }
    }
    :is(button, a):focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 3px;
    }
  </style>
</head>

<body>

  <img src="../../images/MediPointLogo.png" alt="MediPoint Logo" class="logo">
  <a class="portal-access" href="portal-auth.html">Portal Login / Sign Up</a>


  <main class="card">
    <div class="avatar">
        <img src="../../images/personicon.png" alt="Avatar Icon">
    </div>

    <h1>Welcome to <span>MediPoint</span></h1>
    <p class="subtitle">Kiosk login for Student and Personnel</p>

    <div class="role-container">
      <button class="role-card active" data-role="student">
        <div class="icon-circle"><img src="../../images/studenticon.png" alt="Student Icon"></div>
        <h2>STUDENT</h2>
      </button>

      <button class="role-card" data-role="clinic-staff">
        <div class="icon-circle"><img src="../../images/clinicstafficon.png" alt="Clinic Staff Icon"></div>
        <h2>PERSONNEL</h2>
      </button>
    </div>

    <div class="login-container">
      <button class="login-option active" data-login="id">
        <img src="../../images/idicon.png" alt="ID Icon">
        ID
      </button>

      <button class="login-option" data-login="qr">
        <img src="../../images/qricon.png" alt="QR Code Icon">
        QR Code
      </button>
    </div>

    <button class="continue-btn" onclick="continueLogin()">Continue</button>

    <p class="signup-text">New to MediPoint kiosk?</p>
    <a href="login-selection.html?view=signup" class="signup-link">Create an account</a>
  </main>

  <script>
    let selectedRole = "student";
    let selectedLogin = "id";

    const roleCards = document.querySelectorAll(".role-card");
    const loginOptions = document.querySelectorAll(".login-option");

    roleCards.forEach(card => {
      card.addEventListener("click", () => {
        roleCards.forEach(c => c.classList.remove("active"));
        card.classList.add("active");
        selectedRole = card.dataset.role;
      });
    });

    loginOptions.forEach(option => {
      option.addEventListener("click", () => {
        loginOptions.forEach(o => o.classList.remove("active"));
        option.classList.add("active");
        selectedLogin = option.dataset.login;
      });
    });

    function continueLogin() {
      const role = encodeURIComponent(selectedRole === "clinic-staff" ? "personnel" : "student");
      if (selectedLogin === "qr") {
        window.location.href = `login-selection.html?view=qr&role=${role}`;
      } else {
        window.location.href = `login-selection.html?view=id&role=${role}`;
      }
    }
  </script>

</body>
</html>
